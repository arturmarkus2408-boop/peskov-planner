<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#3d4fd4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Планировщик">
<title>PESKOV Smart Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--bg3:#0d1117;--acc:#3d4fd4;--acc2:#5c6bc0;--txt:#f1f5f9;--txt2:#94a3b8;--txt3:#64748b;--brd:#1e2d45;--red:#ef4444;--grn:#10b981;--ylw:#f59e0b;--ora:#ff6b35;--r:12px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;min-height:100vh;overflow-x:hidden}

/* HEADER */
.hdr{background:var(--bg3);padding:10px 14px 0;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--brd)}
.hdr-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.logo{width:34px;height:34px;border-radius:8px;overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;display:block}
.app-title{font-size:14px;font-weight:700}
.app-sub{font-size:10px;color:var(--txt3)}
.lang-bar{margin-left:auto;display:flex;gap:4px}
.lb{padding:3px 10px;border-radius:20px;border:1px solid var(--brd);background:var(--bg2);color:var(--txt2);font-size:11px;cursor:pointer}
.lb.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* DATE STRIP */
.dstrip{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.dstrip::-webkit-scrollbar{display:none}
.dpill{min-width:38px;text-align:center;padding:5px 3px;border-radius:9px;cursor:pointer;flex-shrink:0}
.dpill.on{background:var(--acc)}
.dpill:not(.on):active{background:var(--bg2)}
.dn{font-size:9px;color:var(--txt3);margin-bottom:1px}
.dpill.on .dn{color:rgba(255,255,255,.65)}
.dd{font-size:12px;font-weight:600}
.ddot{width:4px;height:4px;border-radius:50%;margin:2px auto 0;background:var(--acc2)}
.dpill.on .ddot{background:#fff}

/* MAIN */
main{padding:10px 14px 88px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.sec-t{font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.7px}
.sec-c{font-size:11px;color:var(--txt3)}

/* TASK CARD */
.tc{background:var(--bg2);border-radius:var(--r);padding:11px 12px;margin-bottom:7px;border-left:3px solid var(--acc);display:flex;align-items:flex-start;gap:9px;transition:transform .1s;position:relative}
.tc:active{transform:scale(.98)}
.tc.done{border-left-color:var(--grn);opacity:.6}
.tc.urg{border-left-color:var(--red)}
.tc.med{border-left-color:var(--ylw)}
.tcheck{width:22px;height:22px;border-radius:50%;border:2px solid var(--txt3);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:all .15s}
.tc.done .tcheck{background:var(--grn);border-color:var(--grn)}
.tbody{flex:1;min-width:0;cursor:pointer}
.tname{font-size:13px;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc.done .tname{text-decoration:line-through;color:var(--txt3)}
.tmeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ttime{font-size:10px;color:var(--txt3)}
.tbadge{font-size:9px;padding:1px 6px;border-radius:4px;background:rgba(61,79,212,.2);color:var(--acc2)}
.tbadge.urg{background:rgba(239,68,68,.15);color:#f87171}
.tbadge.med{background:rgba(245,158,11,.15);color:#fbbf24}
.tbadge.done{background:rgba(16,185,129,.15);color:#34d399}
.tactions{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.tact{background:none;border:none;font-size:15px;padding:3px;cursor:pointer;border-radius:5px;color:var(--txt3)}
.tact:hover{color:var(--txt)}

/* EMPTY */
.empty{text-align:center;padding:36px 20px}
.empty-ico{font-size:36px;margin-bottom:10px}
.empty-t{font-size:13px;color:var(--txt3)}

/* CALENDAR */
.cal{background:var(--bg2);border-radius:var(--r);padding:12px;margin-bottom:10px}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-title{font-size:14px;font-weight:700}
.cal-nav{background:none;border:none;color:var(--txt2);font-size:22px;padding:4px 8px;cursor:pointer;border-radius:7px}
.cal-nav:active{background:var(--bg3)}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-dname{text-align:center;font-size:10px;color:var(--txt3);padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{text-align:center;padding:6px 2px;border-radius:7px;cursor:pointer;position:relative;min-height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cal-day:active{background:var(--bg3)}
.cal-day.today{background:rgba(61,79,212,.15)}
.cal-day.today .cal-dnum{color:var(--acc)}
.cal-day.selected{background:var(--acc)}
.cal-day.selected .cal-dnum{color:#fff}
.cal-day.other{opacity:.3}
.cal-dnum{font-size:12px;font-weight:500}
.cal-dots{display:flex;gap:2px;justify-content:center;margin-top:2px}
.cal-dot{width:4px;height:4px;border-radius:50%}
.cal-dot.low{background:var(--acc2)}
.cal-dot.med{background:var(--ylw)}
.cal-dot.urg{background:var(--red)}
.cal-day.selected .cal-dot{background:#fff}

/* FAB */
.fab-mic{position:fixed;bottom:78px;right:76px;width:44px;height:44px;background:var(--bg2);border:1px solid var(--brd);border-radius:50%;color:var(--txt2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:200;transition:all .15s}
.fab-mic.on{background:#dc2626;border-color:#dc2626;color:#fff;animation:mpulse 1s infinite}
.fab{position:fixed;bottom:78px;right:16px;width:52px;height:52px;background:var(--acc);border:none;border-radius:50%;color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(61,79,212,.5);z-index:200}
.fab:active{transform:scale(.92)}
@keyframes mpulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.4)}50%{box-shadow:0 0 0 10px rgba(220,38,38,0)}}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg3);border-top:1px solid var(--brd);display:flex;padding:5px 0 env(safe-area-inset-bottom);z-index:300}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;cursor:pointer;color:var(--txt3);font-size:10px;border:none;background:none;transition:color .1s}
.bni.on{color:var(--acc)}
.bni-ico{font-size:20px}

/* MODAL BASE */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:flex-end}
.ov.open{display:flex}
.mdl{background:var(--bg2);border-radius:20px 20px 0 0;padding:18px 16px 36px;width:100%;max-height:92vh;overflow-y:auto}
.mdl-t{font-size:15px;font-weight:700;margin-bottom:14px}
.mclose{float:right;background:none;border:none;color:var(--txt2);font-size:22px;cursor:pointer;margin-top:-3px}
.fg{margin-bottom:12px}
.fl{font-size:11px;color:var(--txt3);margin-bottom:5px;display:block}
.fi{width:100%;background:var(--bg3);border:1px solid var(--brd);border-radius:9px;padding:9px 12px;color:var(--txt);font-size:13px;outline:none}
.fi:focus{border-color:var(--acc)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.prw{display:flex;gap:6px}
.pb{flex:1;padding:7px 4px;border-radius:8px;border:1px solid var(--brd);background:var(--bg3);color:var(--txt2);font-size:11px;cursor:pointer;text-align:center}
.pb.sl{border-color:var(--grn);background:rgba(16,185,129,.12);color:#34d399}
.pb.sm{border-color:var(--ylw);background:rgba(245,158,11,.12);color:#fbbf24}
.pb.su{border-color:var(--red);background:rgba(239,68,68,.12);color:#f87171}
.btn-p{width:100%;padding:12px;background:var(--acc);border:none;border-radius:11px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px}
.btn-p:active{opacity:.85}
.btn-d{width:100%;padding:12px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);border-radius:11px;color:#f87171;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px}

/* VOICE MODAL */
.vmdl{background:var(--bg2);border-radius:20px 20px 0 0;padding:22px 16px 36px;width:100%;text-align:center}
.vanim{width:72px;height:72px;background:var(--acc);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 14px;transition:all .3s}
.vanim.active{background:#dc2626;animation:mpulse 1s infinite}
.vtitle{font-size:15px;font-weight:700;margin-bottom:6px}
.vhint{font-size:12px;color:var(--txt3);margin-bottom:14px;line-height:1.5}
.vres{background:var(--bg3);border-radius:9px;padding:10px 12px;font-size:12px;color:var(--txt2);min-height:44px;margin-bottom:14px;text-align:left;line-height:1.5}
.vstatus{font-size:11px;color:var(--acc);margin-bottom:10px;min-height:16px}
.btn-stop{width:100%;padding:12px;background:#dc2626;border:none;border-radius:11px;color:#fff;font-size:14px;font-weight:600;cursor:pointer}

/* ALERT MODAL */
.alert-ov{display:none;position:fixed;inset:0;background:rgba(20,0,0,.88);z-index:800;align-items:center;justify-content:center;padding:20px}
.alert-ov.open{display:flex}
.alert-box{background:var(--bg2);border-radius:18px;padding:24px 20px;width:100%;max-width:340px;text-align:center;border:2px solid var(--ora);animation:alertGlow 2s ease-in-out infinite}
@keyframes alertGlow{
  0%,100%{box-shadow:0 0 0 3px rgba(255,107,53,.3),0 0 20px rgba(255,107,53,.4),0 0 40px rgba(220,38,38,.2)}
  50%{box-shadow:0 0 0 6px rgba(255,107,53,.5),0 0 40px rgba(255,107,53,.6),0 0 80px rgba(220,38,38,.4)}
}
.alert-ico{font-size:44px;margin-bottom:10px}
.alert-title{font-size:15px;font-weight:700;color:var(--ora);margin-bottom:6px}
.alert-sub{font-size:13px;color:var(--txt2);margin-bottom:14px;line-height:1.5}
.alert-time{font-size:20px;font-weight:700;color:var(--txt);margin-bottom:18px}
.btn-alert{width:100%;padding:12px;background:var(--ora);border:none;border-radius:11px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px}
.btn-alert-done{width:100%;padding:12px;background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);border-radius:11px;color:#34d399;font-size:14px;font-weight:600;cursor:pointer}

/* SETTINGS */
.srow{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid var(--brd);cursor:pointer}
.srow:last-child{border-bottom:none}
.srow-ico{font-size:20px}
.srow-lbl{flex:1;font-size:13px}
.srow-val{font-size:12px;color:var(--txt3)}

/* TOAST */
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--brd);color:var(--txt);font-size:12px;padding:8px 16px;border-radius:18px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.stat-card{background:var(--bg2);border-radius:var(--r);padding:12px;text-align:center}
.stat-n{font-size:24px;font-weight:700;color:var(--acc)}
.stat-l{font-size:10px;color:var(--txt3);margin-top:3px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div class="logo"><img src="icon-192.png" alt=""></div>
    <div><div class="app-title">PESKOV Planner</div><div class="app-sub" id="dayLabel">...</div></div>
    <div class="lang-bar">
      <button class="lb on" onclick="setLang('ru')">RU</button>
      <button class="lb" onclick="setLang('en')">EN</button>
      <button class="lb" onclick="setLang('uz')">UZ</button>
    </div>
  </div>
  <div id="stripWrap"><div class="dstrip" id="dstrip"></div></div>
</div>

<main id="main"></main>

<button class="fab-mic" id="fabMic" onclick="openVoice()">🎙</button>
<button class="fab" onclick="openAdd()">+</button>

<nav class="bnav">
  <button class="bni on" id="n0" onclick="setTab(0)"><span class="bni-ico">🏠</span><span id="nl0">Главная</span></button>
  <button class="bni" id="n1" onclick="setTab(1)"><span class="bni-ico">📅</span><span id="nl1">Календарь</span></button>
  <button class="bni" id="n2" onclick="setTab(2)"><span class="bni-ico">📋</span><span id="nl2">Все</span></button>
  <button class="bni" id="n3" onclick="setTab(3)"><span class="bni-ico">⚙️</span><span id="nl3">Настройки</span></button>
</nav>

<!-- ADD/EDIT MODAL -->
<div class="ov" id="addOv">
  <div class="mdl">
    <div class="mdl-t" id="addTitle">Новая задача<button class="mclose" onclick="closeOv('addOv')">✕</button></div>
    <div class="fg"><label class="fl" id="lname">Название</label><input class="fi" id="iName" placeholder="Что нужно сделать?"></div>
    <div class="fg"><label class="fl" id="lnote">Заметка</label><input class="fi" id="iNote" placeholder="Дополнительно..."></div>
    <div class="fg"><label class="fl" id="ldate">Дата</label><input class="fi" id="iDate" type="date"></div>
    <div class="frow fg">
      <div><label class="fl" id="ltstart">Начало</label><input class="fi" id="iTimeS" type="time"></div>
      <div><label class="fl" id="ltend">Конец</label><input class="fi" id="iTimeE" type="time"></div>
    </div>
    <div class="fg">
      <label class="fl" id="lprio">Приоритет</label>
      <div class="prw">
        <button class="pb" id="pl" onclick="selP('low')">✅ Обычный</button>
        <button class="pb" id="pm" onclick="selP('medium')">⚠️ Средний</button>
        <button class="pb" id="pu" onclick="selP('urgent')">🔴 Срочный</button>
      </div>
    </div>
    <button class="btn-p" onclick="saveTask()" id="saveBtn">Сохранить</button>
    <button class="btn-d" id="delBtn" onclick="deleteEditing()" style="display:none">🗑 Удалить задачу</button>
  </div>
</div>

<!-- VOICE MODAL -->
<div class="ov" id="voiceOv">
  <div class="vmdl">
    <div class="vanim" id="vanim">🎙</div>
    <div class="vtitle" id="vtitle">Говорите...</div>
    <div class="vhint" id="vhint">Примеры команд:<br>«25 мая встреча с 10 до 11, средний»<br>«Перенеси встречу на 27 мая в 15:00»<br>«Удали брифинг»</div>
    <div class="vstatus" id="vstatus"></div>
    <div class="vres" id="vres">Ожидаю...</div>
    <button class="btn-stop" onclick="stopVoice()">■ Остановить</button>
  </div>
</div>

<!-- ALERT MODAL -->
<div class="alert-ov" id="alertOv">
  <div class="alert-box">
    <div class="alert-ico">⚠️</div>
    <div class="alert-title">Срочная задача через 1 час!</div>
    <div class="alert-sub" id="alertName"></div>
    <div class="alert-time" id="alertTime"></div>
    <button class="btn-alert" onclick="closeAlert()">Понял, закрыть</button>
    <button class="btn-alert-done" onclick="markAlertDone()">✅ Уже выполнено</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ========== STATE ==========
let tasks = JSON.parse(localStorage.getItem('pp_tasks') || '[]');
let selDate = new Date();
let tab = 0;
let lang = localStorage.getItem('pp_lang') || 'ru';
let prio = 'low';
let editId = null;
let rec = null;
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let alertTaskId = null;
let notified = new Set(JSON.parse(localStorage.getItem('pp_notified') || '[]'));

// ========== TRANSLATIONS ==========
const TR = {
  ru:{home:'Главная',cal:'Календарь',all:'Все задачи',sets:'Настройки',add:'Новая задача',edit:'Редактировать',save:'Сохранить',name:'Название',note:'Заметка',date:'Дата',tstart:'Начало',tend:'Конец',prio:'Приоритет',plow:'✅ Обычный',pmed:'⚠️ Средний',purg:'🔴 Срочный',done:'Выполнено',pend:'В работе',total:'Всего',urgent:'Срочных',empty:'Нет задач на этот день',speak:'Говорите...',hint:'«25 мая встреча с 10 до 11, средний»\n«Перенеси встречу на 27 мая в 15:00»\n«Удали брифинг»',stop:'■ Остановить',saved:'✅ Задача сохранена!',deleted:'🗑 Удалено',cmpdone:'✅ Выполнено!',notfound:'❌ Задача не найдена',rescheduled:'📅 Задача перенесена',created:'✅ Задача создана',expjson:'📤 Экспорт JSON',expcsv:'📋 Экспорт CSV',cleardone:'Очистить выполненные',exportj:'Экспорт JSON',exportc:'Экспорт CSV',langset:'Язык',low:'обычный',med:'средний',urg:'срочный'},
  en:{home:'Home',cal:'Calendar',all:'All tasks',sets:'Settings',add:'New Task',edit:'Edit',save:'Save',name:'Title',note:'Note',date:'Date',tstart:'Start',tend:'End',prio:'Priority',plow:'✅ Normal',pmed:'⚠️ Medium',purg:'🔴 Urgent',done:'Done',pend:'Pending',total:'Total',urgent:'Urgent',empty:'No tasks for this day',speak:'Speak...',hint:'"Meeting May 25 from 10 to 11, medium"\n"Reschedule meeting to May 27 at 3pm"\n"Delete briefing"',stop:'■ Stop',saved:'✅ Saved!',deleted:'🗑 Deleted',cmpdone:'✅ Done!',notfound:'❌ Task not found',rescheduled:'📅 Rescheduled',created:'✅ Task created',expjson:'📤 Export JSON',expcsv:'📋 Export CSV',cleardone:'Clear done',exportj:'Export JSON',exportc:'Export CSV',langset:'Language',low:'normal',med:'medium',urg:'urgent'},
  uz:{home:'Asosiy',cal:'Taqvim',all:'Barcha',sets:'Sozlamalar',add:'Yangi vazifa',edit:'Tahrirlash',save:'Saqlash',name:'Nomi',note:'Izoh',date:'Sana',tstart:'Boshlanish',tend:'Tugash',prio:'Muhimlik',plow:"✅ Oddiy",pmed:"⚠️ O'rta",purg:"🔴 Shoshilinch",done:'Bajarilgan',pend:'Jarayonda',total:'Jami',urgent:'Shoshilinch',empty:"Bu kun uchun vazifalar yo'q",speak:'Gapiring...',hint:"'25 may uchrashuv soat 10 dan 11 gacha, o'rta'",stop:"■ To'xtatish",saved:"✅ Saqlandi!",deleted:"🗑 O'chirildi",cmpdone:"✅ Bajarildi!",notfound:"❌ Vazifa topilmadi",rescheduled:"📅 Ko'chirildi",created:"✅ Vazifa yaratildi",expjson:"📤 JSON eksport",expcsv:"📋 CSV eksport",cleardone:"Bajarilganlarni tozalash",exportj:"JSON eksport",exportc:"CSV eksport",langset:"Til",low:'oddiy',med:"o'rta",urg:'shoshilinch'}
};
function t(k){return(TR[lang]&&TR[lang][k])||TR.ru[k]||k}

// ========== UTILS ==========
function fmt(d){return d.toISOString().split('T')[0]}
function today(){return fmt(new Date())}
function fmtDisp(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  return d.toLocaleDateString(lang==='en'?'en-GB':lang==='uz'?'uz-UZ':'ru-RU',{day:'numeric',month:'long'});
}
function save(){localStorage.setItem('pp_tasks',JSON.stringify(tasks))}

// ========== DATE PARSER ==========
const MONTHS={
  'января':0,'февраля':1,'марта':2,'апреля':3,'мая':4,'июня':5,'июля':6,'августа':7,'сентября':8,'октября':9,'ноября':10,'декабря':11,
  'январе':0,'феврале':1,'марте':2,'апреле':3,'июне':5,'июле':6,'августе':7,'сентябре':8,'октябре':9,'ноябре':10,'декабре':11,
  'январь':0,'февраль':1,'март':2,'апрель':3,'май':4,'июнь':5,'июль':6,'август':7,'сентябрь':8,'октябрь':9,'ноябрь':10,'декабрь':11,
  'january':0,'february':1,'march':2,'april':3,'may':4,'june':5,'july':6,'august':7,'september':8,'october':9,'november':10,'december':11
};
function parseDate(lc){
  for(const[mn,mi]of Object.entries(MONTHS)){
    const re=new RegExp('(\\d{1,2})(?:-го|-ого)?\\s+'+mn,'i');
    const m=lc.match(re);
    if(m){
      const day=parseInt(m[1]),now=new Date();
      let yr=now.getFullYear();
      let d=new Date(yr,mi,day);
      if(d<new Date(now.getTime()-24*60*60*1000))d.setFullYear(yr+1);
      return fmt(d);
    }
  }
  if(/послезавтра/.test(lc)){const d=new Date();d.setDate(d.getDate()+2);return fmt(d)}
  if(/завтра|tomorrow/.test(lc)){const d=new Date();d.setDate(d.getDate()+1);return fmt(d)}
  if(/сегодня|today/.test(lc))return today();
  const thru=lc.match(/через\s+(\d+)\s+дн/);
  if(thru){const d=new Date();d.setDate(d.getDate()+parseInt(thru[1]));return fmt(d)}
  const wdays=[['воскресен',0],['понедельник',1],['вторник',2],['среду',3],['среда',3],['четверг',4],['пятниц',5],['субботу',6],['суббота',6]];
  for(const[nm,dn]of wdays){
    if(lc.includes(nm)){const d=new Date();const df=(dn-d.getDay()+7)%7||7;d.setDate(d.getDate()+df);return fmt(d)}
  }
  return fmt(selDate);
}

function parseTimeRange(lc){
  // "с 10 до 11" "с 10:30 до 12:00" "в период с 10 до 11 часов" "с 10 по 11"
  const rr=/(?:с|from)\s+(\d{1,2})(?:[:\.](\d{2}))?\s+(?:до|по|to)\s+(\d{1,2})(?:[:\.](\d{2}))?/;
  const rm=lc.match(rr);
  if(rm){
    return{
      start:String(rm[1]).padStart(2,'0')+':'+(rm[2]||'00').padStart(2,'0'),
      end:String(rm[3]).padStart(2,'0')+':'+(rm[4]||'00').padStart(2,'0')
    }
  }
  // "в 14 часов" "в 14:00" "в 14.00"
  const sr=/(?:^|[\s,])(?:в|at)\s+(\d{1,2})(?:[:\.](\d{2}))?(?:\s*(?:час|:| |$))/;
  const sm=lc.match(sr);
  if(sm){return{start:String(sm[1]).padStart(2,'0')+':'+(sm[2]||'00').padStart(2,'0'),end:''}}
  return{start:'',end:''}
}

function parsePrio(lc){
  if(/срочн|urgent|высок|важн/i.test(lc))return'urgent';
  if(/средн|medium/i.test(lc))return'medium';
  return'low';
}

function cleanTaskName(text){
  let s=text;
  // remove month+day
  for(const mn of Object.keys(MONTHS)){s=s.replace(new RegExp('\\d{1,2}(?:-го)?\\s+'+mn,'gi'),'')}
  // remove relative dates
  s=s.replace(/послезавтра|завтра|сегодня|tomorrow|today/gi,'');
  s=s.replace(/через\s+\d+\s+\w+/gi,'');
  s=s.replace(/(?:в\s+)?(?:понедельник|вторник|среду|среда|четверг|пятницу|пятница|субботу|суббота|воскресенье)/gi,'');
  // remove time range
  s=s.replace(/в\s+период\s+с\s+\d+[:.]\d*\s+(?:до|по)\s+\d+[:.]\d*\s*час\w*/gi,'');
  s=s.replace(/с\s+\d{1,2}(?:[:.]\d{2})?\s+(?:до|по)\s+\d{1,2}(?:[:.]\d{2})?\s*(?:час\w*)?/gi,'');
  s=s.replace(/(?:^|[\s,])(?:в|at)\s+\d{1,2}(?:[:.]\d{2})?\s*(?:час\w*)?/gi,'');
  // remove priority words
  s=s.replace(/уровень\s+(?:срочный|средний|обычный|низкий|высокий)/gi,'');
  s=s.replace(/(?:срочный|средний|обычный|низкий|высокий)\s*(?:приоритет)?/gi,'');
  s=s.replace(/(?:срочно|urgently?|medium|normal)/gi,'');
  // remove command words
  s=s.replace(/(?:создай?|поставь|добавь|запиши|поставь)\s+(?:мне\s+)?(?:задачу?|напоминание)?/gi,'');
  s=s.replace(/по\s+итогам\s+(?:которого\s+)?(?:должны?\s+)?(?:быть\s+)?(?:заполнены?\s+)?(?:все\s+)?(?:графы\s+)?/gi,'');
  s=s.replace(/,/g,' ');
  s=s.replace(/\s+/g,' ').trim();
  if(s)s=s.charAt(0).toUpperCase()+s.slice(1);
  return s||'Новая задача';
}

// ========== NLP ENGINE ==========
function findTask(query){
  const qw=query.toLowerCase().split(/\s+/).filter(w=>w.length>2);
  let best=null,bsc=0;
  for(const tk of tasks){
    const tw=tk.name.toLowerCase();
    let sc=qw.filter(w=>tw.includes(w)).length;
    if(sc>bsc){best=tk;bsc=sc}
  }
  return bsc>0?best:null;
}

function processVoice(text){
  const lc=text.toLowerCase().trim();
  
  // DELETE
  if(/удали(?:ть)?|delete\s+task/i.test(lc)){
    const qm=lc.match(/удали(?:ть)?\s+(?:задачу\s+)?(.+)/i)||lc.match(/delete\s+(?:task\s+)?(.+)/i);
    if(qm){
      const tk=findTask(qm[1]);
      if(tk){const nm=tk.name;tasks=tasks.filter(t=>t.id!==tk.id);save();renderAll();return'🗑 «'+nm+'» удалена'}
    }
    return t('notfound');
  }
  
  // COMPLETE
  if(/выполни(?:ть)?|отметь|сделал|done\s+task/i.test(lc)){
    const qm=lc.match(/(?:выполни(?:ть)?|отметь|сделал)\s+(?:задачу\s+)?(.+)/i);
    if(qm){
      const tk=findTask(qm[1]);
      if(tk){tk.done=true;save();renderAll();return'✅ «'+tk.name+'» выполнена'}
    }
    return t('notfound');
  }
  
  // RESCHEDULE — "перенеси встречу на 27 мая в 15:00"
  if(/перенеси(?:ть)?|reschedule/i.test(lc)){
    const qm=lc.match(/перенеси(?:ть)?\s+(.+?)\s+на\s+(.+)/i)||lc.match(/reschedule\s+(.+?)\s+to\s+(.+)/i);
    if(qm){
      const tk=findTask(qm[1]);
      if(tk){
        const dp=qm[2];
        const nd=parseDate(dp);
        const tr=parseTimeRange(dp);
        tk.date=nd;
        if(tr.start)tk.timeStart=tr.start;
        if(tr.end)tk.timeEnd=tr.end;
        save();renderAll();
        selDate=new Date(nd+'T12:00:00');
        renderDstrip();
        return'📅 «'+tk.name+'» перенесена на '+fmtDisp(nd)+(tr.start?' в '+tr.start:'');
      }
    }
    return t('notfound');
  }
  
  // CREATE NEW TASK
  const date=parseDate(lc);
  const tr=parseTimeRange(lc);
  const pr=parsePrio(lc);
  const name=cleanTaskName(text);
  const id=Date.now().toString();
  tasks.push({id,name,note:'',date,timeStart:tr.start,timeEnd:tr.end,priority:pr,done:false,created:new Date().toISOString()});
  save();
  selDate=new Date(date+'T12:00:00');
  renderDstrip();
  renderAll();
  return t('created')+': «'+name+'» → '+fmtDisp(date)+(tr.start?' '+tr.start+(tr.end?'–'+tr.end:''):'');
}

function renderCal(){
  const el=document.getElementById('main');
  const mnNames={ru:['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],en:['January','February','March','April','May','June','July','August','September','October','November','December'],uz:['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktyabr','Noyabr','Dekabr']};
  const dnNames={ru:['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],en:['Mo','Tu','We','Th','Fr','Sa','Su'],uz:['Du','Se','Ch','Pa','Ju','Sh','Ya']};
  const mn=(mnNames[lang]||mnNames.ru)[calMonth];
  const dn=dnNames[lang]||dnNames.ru;
  
  // Build calendar grid
  const first=new Date(calYear,calMonth,1);
  const last=new Date(calYear,calMonth+1,0);
  let startDow=first.getDay(); // 0=Sun
  startDow=(startDow+6)%7; // make Mon=0
  
  let days='';
  // prev month padding
  const prevLast=new Date(calYear,calMonth,0).getDate();
  for(let i=startDow-1;i>=0;i--){
    days+=`<div class="cal-day other"><div class="cal-dnum">${prevLast-i}</div></div>`;
  }
  // current month
  const todStr=today();
  const selStr=fmt(selDate);
  for(let d=1;d<=last.getDate();d++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayTasks=tasks.filter(t=>t.date===ds);
    const isT=ds===todStr;
    const isSel=ds===selStr;
    let cls='cal-day'+(isT?' today':'')+(isSel?' selected':'');
    let dots='';
    if(dayTasks.length>0&&!isSel){
      // show up to 3 dots by priority
      const hasUrg=dayTasks.some(t=>t.priority==='urgent'&&!t.done);
      const hasMed=dayTasks.some(t=>t.priority==='medium'&&!t.done);
      const hasLow=dayTasks.some(t=>!t.done&&t.priority==='low');
      if(hasUrg)dots+=`<div class="cal-dot urg"></div>`;
      if(hasMed)dots+=`<div class="cal-dot med"></div>`;
      if(hasLow||(!hasUrg&&!hasMed&&dayTasks.length>0))dots+=`<div class="cal-dot low"></div>`;
    }else if(dayTasks.length>0&&isSel){
      dots=`<div class="cal-dot"></div>`;
    }
    days+=`<div class="${cls}" onclick="calSelect('${ds}')"><div class="cal-dnum">${d}</div><div class="cal-dots">${dots}</div></div>`;
  }
  // next month padding
  const total=startDow+last.getDate();
  const pad=(7-total%7)%7;
  for(let i=1;i<=pad;i++){
    days+=`<div class="cal-day other"><div class="cal-dnum">${i}</div></div>`;
  }
  
  const selTasks=tasks.filter(t=>t.date===selStr);
  const selPend=selTasks.filter(t=>!t.done);
  const selDone=selTasks.filter(t=>t.done);
  let thtml='';
  if(selTasks.length===0)thtml=`<div class="empty"><div class="empty-ico">📋</div><div class="empty-t">${t('empty')}</div></div>`;
  else{
    if(selPend.length)thtml+=`<div class="sec-hdr"><span class="sec-t">${t('pend')}</span><span class="sec-c">${selPend.length}</span></div>`+selPend.map(taskCard).join('');
    if(selDone.length)thtml+=`<div class="sec-hdr" style="margin-top:16px"><span class="sec-t">${t('done')}</span></div>`+selDone.map(taskCard).join('');
  }
  
  el.innerHTML=`
    <div class="cal">
      <div class="cal-hdr">
        <button class="cal-nav" onclick="calPrev()">‹</button>
        <div class="cal-title">${mn} ${calYear}</div>
        <button class="cal-nav" onclick="calNext()">›</button>
      </div>
      <div class="cal-days">${dn.map(d=>`<div class="cal-dname">${d}</div>`).join('')}</div>
      <div class="cal-grid">${days}</div>
    </div>
    ${thtml}
  `;
}

function startRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){document.getElementById('vres').textContent='Голосовой ввод работает только в Chrome';return}
  rec=new SR();
  rec.lang=lang==='en'?'en-US':lang==='uz'?'uz-UZ':'ru-RU';
  rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=3;
  document.getElementById('vanim').classList.add('active');
  document.getElementById('fabMic').classList.add('on');
  rec.onresult=e=>{
    let inter='',fin='';
    for(let r of e.results){if(r.isFinal)fin+=r[0].transcript;else inter+=r[0].transcript}
    document.getElementById('vres').textContent=fin||inter||'...';
    if(fin){
      const result=processVoice(fin);
      document.getElementById('vstatus').textContent=result;
    }
  };
  rec.onerror=e=>{document.getElementById('vstatus').textContent='⚠️ '+e.error};
  rec.onend=()=>{document.getElementById('vanim').classList.remove('active');document.getElementById('fabMic').classList.remove('on')};
  try{rec.start()}catch(e){}
}

function stopVoice(){if(rec)try{rec.stop()}catch(e){}closeOv('voiceOv')}

// ========== ALERT ==========
let alertQueue=[];
function checkAlerts(){
  const now=new Date();
  const todStr=today();
  for(const tk of tasks){
    if(tk.done||!tk.timeStart||tk.date!==todStr)continue;
    if(notified.has(tk.id))continue;
    const[h,m]=tk.timeStart.split(':').map(Number);
    const tt=new Date(now);tt.setHours(h,m,0,0);
    const diff=tt-now;
    if(diff>=54*60*1000&&diff<=66*60*1000){
      notified.add(tk.id);
      localStorage.setItem('pp_notified',JSON.stringify([...notified]));
      alertQueue.push(tk);
    }
  }
  if(alertQueue.length>0&&document.getElementById('alertOv').style.display===''){
    showNextAlert();
  }
}
function showNextAlert(){
  if(alertQueue.length===0)return;
  const tk=alertQueue[0];
  alertTaskId=tk.id;
  document.getElementById('alertName').textContent='«'+tk.name+'»';
  document.getElementById('alertTime').textContent=tk.timeStart+(tk.timeEnd?'–'+tk.timeEnd:'');
  document.getElementById('alertOv').classList.add('open');
  // vibrate
  if(navigator.vibrate)navigator.vibrate([200,100,200]);
}
function closeAlert(){document.getElementById('alertOv').classList.remove('open');alertQueue.shift();setTimeout(showNextAlert,300)}
function markAlertDone(){
  const tk=tasks.find(t=>t.id===alertTaskId);
  if(tk)tk.done=true;
  save();renderAll();renderDstrip();closeAlert();
}

// ========== TABS ==========
function setTab(n){
  tab=n;
  [0,1,2,3].forEach(i=>document.getElementById('n'+i).classList.toggle('on',i===n));
  document.getElementById('stripWrap').style.display=n===1?'none':'block';
  renderAll();
}

function updateNavLabels(){
  document.getElementById('nl0').textContent=t('home');
  document.getElementById('nl1').textContent=t('cal');
  document.getElementById('nl2').textContent=t('all');
  document.getElementById('nl3').textContent=t('sets');
}

// ========== LANG ==========
function setLang(l){
  lang=l;localStorage.setItem('pp_lang',l);
  document.querySelectorAll('.lb').forEach(b=>b.classList.toggle('on',b.textContent===l.toUpperCase()));
  renderDstrip();renderAll();
}

// ========== HELPERS ==========
function closeOv(id){document.getElementById(id).classList.remove('open')}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500)}
function exportJSON(){const b=new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='peskov_tasks.json';a.click();showToast(t('expjson'))}
function exportCSV(){const r=[['Name','Date','Start','End','Priority','Done','Note'],...tasks.map(t=>[t.name,t.date,t.timeStart,t.timeEnd,t.priority,t.done,t.note])];const c=r.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');const b=new Blob([c],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='peskov_tasks.csv';a.click();showToast(t('expcsv'))}
function clearDone(){tasks=tasks.filter(t=>!t.done);save();renderAll();renderDstrip();showToast('🗑 Готово')}

// ========== INIT ==========
function init(){
  if(tasks.length===0){
    const td=today();
    const tom=fmt(new Date(new Date().setDate(new Date().getDate()+1)));
    tasks=[
      {id:'1',name:'Брифинг для прессы',note:'Основные тезисы',date:td,timeStart:'10:00',timeEnd:'11:00',priority:'urgent',done:false,created:new Date().toISOString()},
      {id:'2',name:'Встреча с советниками',note:'',date:td,timeStart:'14:00',timeEnd:'15:30',priority:'low',done:false,created:new Date().toISOString()},
      {id:'3',name:'Отчёт по заседанию',note:'',date:td,timeStart:'09:00',timeEnd:'',priority:'low',done:true,created:new Date().toISOString()},
      {id:'4',name:'Пресс-конференция',note:'',date:tom,timeStart:'12:00',timeEnd:'13:30',priority:'medium',done:false,created:new Date().toISOString()},
    ];
    save();
  }
  // migrate old tasks (timeStart/timeEnd from old time field)
  tasks=tasks.map(tk=>{
    if(!tk.timeStart&&tk.time){tk.timeStart=tk.time;delete tk.time}
    if(!tk.timeEnd)tk.timeEnd='';
    return tk;
  });save();
  
  document.querySelectorAll('.ov').forEach(ov=>{ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('open')})});
  document.getElementById('iDate').addEventListener('keydown',e=>{if(e.key==='Enter')saveTask()});
  document.getElementById('iName').addEventListener('keydown',e=>{if(e.key==='Enter')saveTask()});
  
  renderDstrip();renderAll();
  setInterval(checkAlerts,60000);
  checkAlerts();
  
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(location.search.includes('action=new'))openAdd();
}

document.addEventListener('DOMContentLoaded',init);
</script>
